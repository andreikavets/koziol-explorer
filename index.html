<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kozioł">
<title>Kozioł Explorer – prototyp</title>
<style>
:root{--bg:#0b1020;--panel:#161d36;--ink:#eef1ff;--mute:#9aa3c7;--gold:#ffd23f;--line:#2b3560;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-user-select:none;user-select:none}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#top{width:100%;max-width:420px;display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;gap:8px}
#top b{font-size:17px}#hud{font-size:13px;color:var(--mute);text-align:right}
#wrap{position:relative;flex:1;min-height:0;width:100%;max-width:420px;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;aspect-ratio:9/16;background:#000;border-radius:10px}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,8,20,.82);border-radius:10px}
#card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;width:100%}
#card h2{margin:0 0 6px;font-size:22px}#card p{margin:6px 0;line-height:1.45;color:var(--mute);font-size:14px}
#card ul{margin:8px 0;padding-left:18px;line-height:1.5;font-size:14px}
.go{margin-top:10px;width:100%;padding:12px;border:0;border-radius:10px;background:var(--gold);color:#1a1a1a;font-weight:700;font-size:16px}
.go.alt{background:var(--line);color:var(--ink)}
#mu{background:none;border:1px solid var(--line);border-radius:8px;color:var(--ink);font-size:14px;padding:2px 8px}
.w{display:flex;gap:8px;margin-top:8px}.w button{flex:1;padding:12px 4px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:14px}
</style>
</head>
<body>
<div id="top"><b>Kozioł Explorer</b><div id="hud"></div><button id="mu">🔊</button></div>
<div id="wrap">
<canvas id="c" width="360" height="640"></canvas>
<div id="ov"><div id="card"></div></div>
</div>

function load(i){wi=i;const w=WORLDS[i];dist=0;score=0;obs=[];stars=[];starTotal=0;p.y=GY;p.vy=0;p.on=true;jbuf=0;spd=1;stormT=0;genX=600;lastH=0;chain=0;pn=0;toastT=0;gx=PX;fill()}
function fill(){const w=WORLDS[wi],a=apex(w),jd=air(w)*SPEED,g=G0*w.g,maxH=Math.min(a*3,460);
 while(genX<dist+W+400&&genX<LEN-500){
  const pw=(120+jd*.25)*(.7+Math.random()*.6);
  const r=Math.random();let h;if(chain>=2||r>.8){h=a*(.5+Math.random()*.2);chain=0}else if(r<.45){h=lastH+a*(.3+Math.random()*.35);chain++}else{h=Math.max(a*(.5+Math.random()*.2),lastH-a*(.5+Math.random()*1.5))}
  h=Math.max(a*.5,Math.min(maxH,h,lastH+a*.7));if(Math.abs(h-lastH)<a*.3)h=lastH+(lastH+a*.3<=maxH?a*.3:-a*.3);h=Math.max(a*.5,Math.min(maxH,h));if(h<=a*.7)chain=0;
  const dh=Math.max(0,h-lastH),tc=(JV+Math.sqrt(Math.max(0,JV*JV-2*g*dh)))/g,reach=SPEED*tc*.7;
  const gap=Math.max(24,reach*(.45+Math.random()*.55));
  obs.push({x:genX,w:pw,h});
  const hs=Math.min(h-34,a*.8+40);if(hs>=62){stars.push({x:genX+pw*.5,y:GY-hs,got:0});starTotal++}
  else{stars.push({x:genX+pw*.5,y:Math.max(40,GY-h-Math.max(52,Math.min(a*.6+30,90))),got:0});starTotal++}
  stars.push({x:genX+pw+gap/2,y:GY-(62+Math.random()*(a*.8-22)),got:0});starTotal++;
  if(pn===6||pn===17)stars[stars.length-1].fact=pn===6?0:1;pn++;
  lastH=h;genX+=pw+gap}}
let BEST=[0,0,0];
try{const b=JSON.parse(localStorage.getItem('ke_best')||'null');if(Array.isArray(b))BEST=b}catch(e){}
function saveBest(){try{localStorage.setItem('ke_best',JSON.stringify(BEST))}catch(e){}}
function show(h){ov.style.display='flex';card.innerHTML=h}
function splash(){st='menu';mOn=false;show(`<div style="text-align:center"><img src="${LG.src}" width="96" height="96" style="display:block;margin:0 auto 8px"><h2 style="font-size:26px;margin:4px 0">Kozioł Explorer</h2><p style="margin:2px 0 10px;color:var(--gold);font-weight:600;font-size:15px">From Lublin to the stars</p><div style="background:#fff;border-radius:10px;padding:8px 12px;margin:6px auto 2px;width:240px"><img src="${ES.src}" style="display:block;width:100%"></div><button class="go" onclick="menu()">Graj</button></div>`)}
function menu(){st='menu';mOn=false;show(`<h2>Kozioł Explorer</h2><p>Kozioł z herbu Lublina biegnie przez kosmos. Dotknij ekran, żeby skoczyć. Wskakuj na platformy, zbieraj gwiazdy wiszące pod nimi i dobiegnij do flagi. Każda planeta ma inną grawitację.</p><div class="w">${WORLDS.map((w,i)=>`<button onclick="start(${i})"><i style="display:block;width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:${['#3d7fd1','#aab0c2','#c4552d'][i]}"></i>${w.n}<span style="display:block;font-size:11px;color:var(--mute);margin-top:2px">${BEST[i]?'★ '+BEST[i]+'%':'—'}</span></button>`).join('')}</div>`)}
function start(i){mOn=false;ac();load(i);const w=WORLDS[i];show(`<h2>${w.n}</h2><p>${w.intro}</p><button class="go" onclick="go()">Start</button>`)}
function go(){ov.style.display='none';st='play';t0=t;ac();musicOn()}
let t0=0;
function done(){st='done';mOn=false;sfx('win');const w=WORLDS[wi],pct=starTotal?Math.round(score/starTotal*100):0,nb=pct>BEST[wi],rt=pct>=90?3:pct>=60?2:pct>=25?1:0;if(nb){BEST[wi]=pct;saveBest()}const nx=wi<2?`<button class="go" onclick="start(${wi+1})">Dalej: ${WORLDS[wi+1].n}</button>`:'';
 show(`<h2>${w.n}: ukończone!</h2><p style="font-size:26px;letter-spacing:4px;color:var(--gold);margin:0">${'★'.repeat(rt)}${'☆'.repeat(3-rt)}</p><p>Gwiazdy: ${score} / ${starTotal} (${pct}%) · ${nb?'<b style="color:var(--gold)">nowy rekord!</b>':'rekord: '+BEST[wi]+'%'}${pct===100?'<br><b style="color:var(--gold)">Komplet gwiazd!</b>':''}</p><p><b style="color:var(--ink)">Z encyklopedii:</b></p><ul>${w.facts.map(f=>`<li>${f}</li>`).join('')}</ul>${nx}<button class="go alt" onclick="menu()">Wybór planety</button>`)}
function die(){st='dead';const w=WORLDS[wi];show(`<h2>Kozioł się potknął</h2><p>${w.fail}</p><p>Dystans: ${Math.floor(dist/LEN*100)}%</p><button class="go" onclick="start(${wi})">Spróbuj jeszcze raz</button><button class="go alt" onclick="menu()">Wybór planety</button>`)}
function tap(){if(st!=='play')return;jbuf=.15}
document.getElementById('wrap').addEventListener('pointerdown',e=>{if(st==='play'){e.preventDefault();tap()}});
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();tap()}});
function step(dt){
 const w=WORLDS[wi],g=G0*w.g;
 let storm=false;
 if(w.wind){stormT+=dt;storm=(stormT%12)>8}
 spd=storm?1.5:1;
 if(storm)gx=Math.max(10,gx-(p.on?100:160)*dt);else gx=Math.min(PX,gx+90*dt);
 dist+=SPEED*dt;toastT-=dt;sq-=dt;
 jbuf-=dt;if(jbuf>0&&p.on){p.vy=-JV;p.on=false;jbuf=0;sfx('jump')}
 const py=p.y,wasOn=p.on;p.on=false;p.vy+=g*dt;p.y+=p.vy*dt;
 if(p.y>=GY){p.y=GY;p.vy=0;p.on=true}
 fill();
 if(p.vy>=0)for(const o of obs){const sx=o.x-dist+PX,top=GY-o.h;
  if(py<=top+4&&p.y>=top&&sx<gx+20&&sx+o.w>gx-12){p.y=top;p.vy=0;p.on=true}}
 if(p.on&&!wasOn){sfx('land');sq=.12;puff(gx+4,p.y,8,'rgba(255,255,255,.7)',100,45)}
 if(p.on&&Math.random()<dt*14)puff(gx-12,p.y-1,1,'rgba(255,255,255,.35)',30,25);
 if(!p.on&&Math.random()<dt*45)puff(gx-14,p.y-12,1,'rgba(255,170,60,.85)',30,-70);
 for(const s of stars)if(!s.got){const sx=s.x-dist+PX;if(Math.hypot(sx-(gx+6),s.y-(p.y-22))<26){s.got=1;score++;puff(sx,s.y,10,s.fact!==undefined?'#5fe3ff':'#ffd23f',170,130);if(s.fact!==undefined){toast=w.run[s.fact];toastT=5;sfx('fact')}else sfx('star')}}
 obs=obs.filter(o=>o.x+o.w-dist+PX>-20);stars=stars.filter(s=>s.x-dist+PX>-60);
 if(dist>=LEN)done();
 hud.innerHTML=`${w.n} · ${String(w.g).replace('.',',')} g · ★ ${score}`;
}
function goat(){const air=!p.on,ph=t*16,cx=gx+4;
 const kq=0,sy=1,sxx=1;
 x.save();x.translate(cx,p.y);x.scale(sxx,sy);x.lineCap='round';x.lineJoin='round';
 const bob=air?0:-Math.abs(Math.sin(ph))*1.6;
 const leg=(hx,off,col)=>{const fx=air?hx+(hx>0?5:-5):hx+Math.sin(ph+off)*6,fy=air?-4:-1-Math.max(0,Math.cos(ph+off))*4;
  x.strokeStyle=col;x.lineWidth=5;x.beginPath();x.moveTo(hx,-16+bob);x.lineTo(fx,fy);x.stroke();
  x.fillStyle='#3a3f63';x.beginPath();x.ellipse(fx+1,fy,3.4,2.3,0,0,7);x.fill()};
 leg(-10,Math.PI,'#cbc5b4');leg(8,0,'#cbc5b4');leg(-6,0,'#f2efe5');leg(12,Math.PI,'#f2efe5');
 x.save();x.translate(0,bob);
 x.fillStyle='#7d86a8';x.beginPath();x.roundRect(-25,-38,10,18,3);x.fill();x.fillStyle='#d4213d';x.fillRect(-25,-32,10,3);
 if(air){const fl=4+Math.random()*6;x.fillStyle='#ff9a2e';x.beginPath();x.moveTo(-24,-20);x.lineTo(-16,-20);x.lineTo(-20,-12+fl);x.fill();x.fillStyle='#ffe27a';x.beginPath();x.moveTo(-22.5,-20);x.lineTo(-17.5,-20);x.lineTo(-20,-15+fl*.6);x.fill()}
 x.save();x.translate(-17,-27);x.rotate(Math.sin(t*10)*.35);x.fillStyle='#f7f4ec';x.beginPath();x.ellipse(-3,-2,4.5,2.6,-.5,0,7);x.fill();x.restore();
 x.fillStyle='#d9d4c5';x.beginPath();x.ellipse(0,-22,17.5,10.5,0,0,7);x.fill();
 x.fillStyle='#f7f4ec';x.beginPath();x.ellipse(0,-24,17,10,0,0,7);x.fill();
 x.fillStyle='#d4213d';x.beginPath();x.moveTo(8,-31);x.lineTo(-8,-30+Math.sin(t*12)*2.5);x.lineTo(-4,-25+Math.sin(t*12+1)*2);x.lineTo(8,-26);x.fill();
 x.beginPath();x.roundRect(6,-34,9,9,3);x.fill();
 x.fillStyle='#f7f4ec';x.beginPath();x.arc(16,-38,9.5,0,7);x.fill();
 x.fillStyle='#efe8d8';x.beginPath();x.ellipse(23,-35.5,5.2,4,0,0,7);x.fill();
 x.beginPath();x.moveTo(22,-31);x.lineTo(24,-26);x.lineTo(19,-30);x.fill();
 x.fillStyle='#3a3f63';x.beginPath();x.ellipse(26.5,-36.5,1.6,1.2,0,0,7);x.fill();
 x.strokeStyle='#3a3f63';x.lineWidth=1;x.beginPath();x.arc(24,-34.5,2.2,.2,1.5);x.stroke();
 x.save();x.translate(9,-39);x.rotate(-.7+Math.sin(ph*.5)*.12);x.fillStyle='#e3ddcd';x.beginPath();x.ellipse(-3,0,6,3,0,0,7);x.fill();x.restore();
 if((t%4)<.12){x.strokeStyle='#3a3f63';x.lineWidth=1.6;x.beginPath();x.moveTo(16,-40);x.lineTo(19.8,-40);x.stroke()}
 else{x.fillStyle='#2a2f4a';x.beginPath();x.ellipse(18,-40,2.4,3,0,0,7);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(18.8,-41.3,.95,0,7);x.fill()}
 x.fillStyle='rgba(255,140,150,.45)';x.beginPath();x.arc(15.5,-35,2.4,0,7);x.fill();
 x.strokeStyle='#e9b43a';x.lineWidth=3.4;x.beginPath();x.moveTo(13,-46);x.quadraticCurveTo(8,-57,3,-54);x.moveTo(19,-46);x.quadraticCurveTo(19,-59,13,-59);x.stroke();
 x.strokeStyle='#ffd876';x.lineWidth=1;x.beginPath();x.moveTo(12.5,-47);x.quadraticCurveTo(8,-56,4,-54);x.stroke();
 x.fillStyle='rgba(150,215,255,.13)';x.strokeStyle='rgba(210,235,255,.85)';x.lineWidth=1.6;x.beginPath();x.arc(16,-40,14.5,0,7);x.fill();x.stroke();
 x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=2;x.beginPath();x.arc(16,-40,11.5,3.5,4.4);x.stroke();
 x.restore();x.restore()}
function draw(){
 const w=WORLDS[wi],gd=x.createLinearGradient(0,0,0,GY);gd.addColorStop(0,w.sky[0]);gd.addColorStop(1,w.sky[1]);
 x.fillStyle=gd;x.fillRect(0,0,W,H);
 x.fillStyle='rgba(255,255,255,.8)';for(let i=0;i<(wi?40:120);i++){const sx=(((i*97)%W-dist*.1)%W+W)%W,sy=(i*53)%420;x.fillRect(sx,sy,i%3?1:2,i%3?1:2)}
 scenery();
 if(!wi){x.fillStyle='#e9e9ef';x.beginPath();x.arc(285,92,8,0,7);x.fill();x.fillStyle='rgba(120,125,150,.5)';x.beginPath();x.arc(282,90,2,0,7);x.arc(288,95,1.5,0,7);x.fill()}
 x.fillStyle=w.gr;x.fillRect(0,GY,W,H-GY);x.fillStyle='rgba(255,255,255,.14)';x.fillRect(0,GY,W,3);
 x.fillStyle='rgba(0,0,0,.25)';for(let i=0;i<8;i++)x.fillRect((((i*50-dist)%400)+400)%400-40,GY+14+(i%3)*14,36,4);
 for(const o of obs){const sx=o.x-dist+PX,ty=GY-o.h,pc=PLC[wi];x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.roundRect(sx+3,ty+6,o.w-6,12,5);x.fill();x.fillStyle=pc[1];x.beginPath();x.roundRect(sx+2,ty+7,o.w-4,9,4);x.fill();x.fillStyle=pc[0];x.beginPath();x.roundRect(sx,ty,o.w,11,5);x.fill();x.fillStyle='rgba(255,255,255,.6)';for(let q=16;q<o.w-10;q+=26)x.fillRect(sx+q,ty+11,4,2)}
 for(const s of stars)if(!s.got){x.fillStyle=s.fact!==undefined?'#5fe3ff':'#ffd23f';x.beginPath();for(let k=0;k<10;k++){const a=-1.5708+k*.6283,rr=(k%2?5:12)*(s.fact!==undefined?1.4:1),qx=s.x-dist+PX+Math.cos(a)*rr,qy=s.y+Math.sin(t*3+s.x)*3+Math.sin(a)*rr;k?x.lineTo(qx,qy):x.moveTo(qx,qy)}x.fill()}
 if(LEN-dist+PX<W+40){const fx=LEN-dist+PX;x.fillStyle='#ddd';x.fillRect(fx,GY-100,3,100);if(LG.complete)x.drawImage(LG,fx+3,GY-100,56,56)}
 goat();for(const q of parts){x.globalAlpha=Math.max(0,q.l/q.m);x.fillStyle=q.c;x.beginPath();x.arc(q.x,q.y,q.r,0,7);x.fill()}x.globalAlpha=1;
 x.fillStyle='rgba(255,255,255,.2)';x.fillRect(16,14,W-32,6);x.fillStyle='#ffd23f';x.fillRect(16,14,(W-32)*Math.min(1,dist/LEN),6);
 if(w.wind&&spd>1){x.strokeStyle='rgba(255,200,150,.4)';x.lineWidth=2;for(let i=0;i<14;i++){const yy=(i*47)%GY,xx=((i*131-t*600)%W+W)%W;x.beginPath();x.moveTo(xx,yy);x.lineTo(xx+30,yy+4);x.stroke()}
  x.fillStyle='#ffd8b0';x.font='bold 14px system-ui';x.fillText('Burza pyłowa! Wiatr znosi cię w lewo',14,44)}
 else if(w.wind&&(stormT%12)>6.5&&(stormT%12)<=8){x.fillStyle='#ffd8b0';x.font='bold 14px system-ui';x.fillText('Nadchodzi burza pyłowa…',14,44)}
 if(toastT>0){x.globalAlpha=Math.min(1,toastT);x.fillStyle='rgba(10,16,40,.92)';x.strokeStyle='#5fe3ff';x.lineWidth=1.5;x.font='13px system-ui';const ws=toast.split(' ');let ln='';const L=[];for(const q of ws){const tt=ln?ln+' '+q:q;if(x.measureText(tt).width>W-52){L.push(ln);ln=q}else ln=tt}L.push(ln);
  const bh=L.length*17+32;x.beginPath();x.roundRect(12,58,W-24,bh,10);x.fill();x.stroke();x.fillStyle='#5fe3ff';x.font='bold 11px system-ui';x.fillText('CIEKAWOSTKA',24,76);x.fillStyle='#fff';x.font='13px system-ui';L.forEach((l,i)=>x.fillText(l,24,95+i*17));x.globalAlpha=1}
 if(st==='play'&&t-t0<2.5){x.fillStyle='#fff';x.font='bold 16px system-ui';x.textAlign='center';x.fillText('Dotknij ekran, żeby skoczyć',W/2,200);x.textAlign='left'}
}
let sq=0,parts=[];function puff(px,py,n,col,sp,up){for(let i=0;i<n;i++)parts.push({x:px,y:py,vx:(Math.random()-.5)*sp,vy:-Math.random()*up,l:.45+Math.random()*.4,m:.85,c:col,r:1.5+Math.random()*2.2})}
function hill(col,amp,sp,base){x.fillStyle=col;x.beginPath();x.moveTo(0,GY);for(let sx=0;sx<=W+12;sx+=12){const u=sx+dist*sp;x.lineTo(sx,base-(Math.sin(u*.02)+1)*amp*.5-(Math.sin(u*.057)+1)*amp*.25)}x.lineTo(W,GY);x.fill()}
function scenery(){
 if(wi===1){const g2=x.createRadialGradient(72,104,4,80,110,26);g2.addColorStop(0,'#7fc2ff');g2.addColorStop(1,'#1f4fa8');x.fillStyle=g2;x.beginPath();x.arc(80,110,26,0,7);x.fill();x.fillStyle='rgba(70,170,90,.85)';x.beginPath();x.ellipse(74,106,8,5,.4,0,7);x.ellipse(90,118,6,4,-.3,0,7);x.fill();x.fillStyle='rgba(255,255,255,.35)';x.beginPath();x.ellipse(82,100,10,2.5,0,0,7);x.fill()}
 if(wi===2){x.fillStyle='rgba(255,200,150,.15)';x.beginPath();x.arc(290,120,16,0,7);x.fill();x.fillStyle='rgba(255,230,190,.9)';x.beginPath();x.arc(290,120,6,0,7);x.fill()}
 if(wi>0){const c=wi===1?['#23273d','#303551']:['#6e2a17','#8a3920'];hill(c[0],26,.12,GY-40);hill(c[1],18,.25,GY-14)}}
const PLC=[['#cdd6ff','#6f7cc4'],['#d9dbe8','#8c90ad'],['#f0c8a8','#a8603c']];
let AC=null,muted=false,mOn=false,mnext=0,mstep=0,mTimer=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,s,slide){const c=ac();if(!c||muted)return;const o=c.createOscillator(),g=c.createGain(),t0=c.currentTime+(s||0);o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t0+d);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(c.destination);o.start(t0);o.stop(t0+d+.02)}
function sfx(k){if(k==='jump')tone(300,.18,'square',.05,0,2.2);else if(k==='land')tone(110,.08,'triangle',.08);else if(k==='star'){tone(880,.09,'square',.04);tone(1320,.14,'square',.04,.08)}else if(k==='fact'){[660,880,1100,1320].forEach((f,i)=>tone(f,.16,'triangle',.07,i*.08))}else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.25,'square',.05,i*.14))}}
const MUS=[{b:120,root:220,sc:[0,4,7,12,7,4,9,5],bass:[0,0,5,7]},{b:76,root:196,sc:[0,7,12,7,3,10,14,10],bass:[0,0,3,-2]},{b:100,root:175,sc:[0,3,7,10,7,3,8,5],bass:[0,0,-4,-2]}];
function musicTick(){const c=ac();if(!c||muted||!mOn)return;const m=MUS[wi],sd=60/m.b/2;if(mnext<c.currentTime)mnext=c.currentTime+.05;
 while(mnext<c.currentTime+.3){const i=mstep%m.sc.length,d=mnext-c.currentTime;tone(m.root*2*Math.pow(2,m.sc[i]/12),sd*.9,'triangle',.035,d);if(mstep%4===0)tone(m.root/2*Math.pow(2,m.bass[(mstep/4|0)%m.bass.length]/12),sd*3.5,'sine',.07,d);mnext+=sd;mstep++}}
function musicOn(){mOn=true;mstep=0;mnext=0;if(!mTimer)mTimer=setInterval(musicTick,100)}
const mu=document.getElementById('mu');mu.onclick=e=>{e.stopPropagation();muted=!muted;mu.textContent=muted?'🔇':'🔊'};
let last=0;function loop(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;t+=dt;if(st==='play')step(dt);for(const q of parts){q.x+=q.vx*dt-(st==='play'?SPEED*dt:0);q.y+=q.vy*dt;q.vy+=220*dt;q.l-=dt}parts=parts.filter(q=>q.l>0);draw();requestAnimationFrame(loop)}
load(0);splash();requestAnimationFrame(loop);
</script>
